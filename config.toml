# ============================================================================================
# agentic-local-app — configuration globale (ADR-018)
#
# Un seul fichier pour tout ce qui est externe ou paramétrable. Chaque valeur peut être
# surchargée par une variable d'environnement AGENTIC__<SECTION>__<CLE>, par exemple :
#   AGENTIC__TRANSPORT__USER_ID=alice
#   AGENTIC__API__PORT=9000
# Les secrets ne sont jamais écrits ici : le jeton du modèle est lu dans la variable nommée par
# transport.token_env (un fichier .env local, ignoré par git, peut la fournir).
# ============================================================================================

[app]
name = "agentic-local-app"
data_dir = "./data"          # base SQLite, blobs, journal d'audit
log_level = "INFO"
env_file = ".env"            # chargé au démarrage, sans écraser les variables déjà définies

# --------------------------------------------------------------------------------------------
# Transport vers le modèle distant (ADR-004, ADR-020, ADR-021). Placeholders : {conversation_id}, {after}
# --------------------------------------------------------------------------------------------
[transport]
provider  = "generic_http"              # implémentation (ADR-020) : generic_http (contrat ADR-004),
                                        # templated_http (API décrite par [transport.options]),
                                        # fake (double scripté, aucun réseau), un entry point du
                                        # groupe agentic_local_app.transports, ou "paquet.module:Classe"
                                        # (`agentic-app transport list` / `transport show`)
codec     = "passthrough"               # codec de messages (ADR-021) : forme brute des réponses du
                                        # modèle -> enveloppes protocolaires, et inversement en sortie.
                                        # passthrough (identité : le transport rend déjà des enveloppes),
                                        # json_text (texte contenant le JSON du message, prose et
                                        # clôtures Markdown tolérées), tool_call (arguments d'un appel
                                        # d'outil), un entry point du groupe agentic_local_app.codecs,
                                        # ou "paquet.module:Classe" (`agentic-app codec list` / `codec show`)
init_url  = "http://127.0.0.1:9000/v1/conversations"
post_url  = "http://127.0.0.1:9000/v1/conversations/{conversation_id}/messages"
get_url   = "http://127.0.0.1:9000/v1/conversations/{conversation_id}/messages?after={after}"
close_url = ""                          # optionnel ; vide = fermeture locale seulement
close_method = "POST"                   # generic_http : méthode de close_url, POST ou DELETE
token_env = "AGENTIC_TRANSPORT_TOKEN"   # variable d'environnement portant le jeton (facultatif)
user_id   = "local-user"                # envoyé en en-tête X-User-Id et dans l'init
# credential_fields : ce que l'interface doit demander avant d'appeler ce modèle (ADR-027). Absent,
# le profil se comporte comme s'il déclarait exactement un champ implicite {key = "access_token",
# label = "Access token", placeholder = "Paste an access token", secret = true, env = token_env} ;
# et aucun champ du tout quand token_env est vide. Le déclarer sert dès qu'il faut autre chose
# qu'un jeton (un identifiant de conversation, une organisation, un espace de travail) ou quand la
# variable lue par le provider n'est pas celle de token_env.
#   key         identifiant renvoyé par l'interface dans POST /credentials (forme d'identifiant)
#   label       libellé affiché au-dessus du champ
#   placeholder facultatif
#   secret      facultatif, VRAI par défaut : une valeur secrète n'est jamais retenue entre deux
#               lancements par l'interface ; mettre false n'a de sens que pour une valeur publique
#   env         variable d'environnement où la valeur est écrite ; elle n'est jamais exposée par
#               GET /models, qui ne rend que key, label, placeholder et secret
# [[transport.credential_fields]]
# key = "access_token"
# label = "Jeton d'accès"
# placeholder = "Coller un jeton d'accès"
# env = "CLAUDE_API_KEY"
# [[transport.credential_fields]]
# key = "chat_id"
# label = "Identifiant de conversation"
# secret = false                        # valeur publique : l'interface peut la retenir
# env = "CLAUDE_CHAT_ID"
request_timeout_ms = 15000              # timeout d'un appel HTTP
poll_interval_ms   = 1000               # intervalle entre deux GET sans réponse
reply_timeout_ms   = 120000             # attente maximale d'une réponse du modèle (MODEL_GET_TIMEOUT)
gzip = true
verify_tls = true

# Options propres au provider (ADR-020) : aucune pour generic_http et fake. Exemple complet pour
# templated_http, qui décrit n'importe quelle API HTTP : méthode, URL, en-têtes et corps de chaque
# opération, chemins de lecture des réponses. Placeholders : {conversation_id}, {after} (encodés
# dans les URL), {instructions}, {user_id}, {metadata_json}, {message_json}, {message_id},
# {message_type}, {token} ; ${env:VAR} partout, résolu au moment de l'appel (jamais écrit ici).
# Une feuille de corps valant exactement "{message_json}" ou "{metadata_json}" reçoit l'objet
# JSON lui-même ; les chemins de réponse acceptent les index de liste (data.items[0].id).
#
# [transport]
# provider = "templated_http"
# [transport.options]
# headers = { "X-Api-Key" = "${env:MY_MODEL_KEY}" }        # en-têtes communs à toutes les opérations
# [transport.options.init]
# method = "POST"
# url = "https://api.example.com/v1/threads"
# body = { instructions = "{instructions}", user = "{user_id}", meta = "{metadata_json}" }
# conversation_id_path = "data.id"
# expected_statuses = [200, 201]
# [transport.options.post]
# method = "POST"
# url = "https://api.example.com/v1/threads/{conversation_id}/messages"
# body = { role = "user", content = "{message_json}" }
# accepted_path = "ok"                                      # optionnel : absent => accepté si statut attendu
# message_id_path = "id"                                    # optionnel : absent => message_id du message envoyé
# [transport.options.get]
# method = "GET"
# url = "https://api.example.com/v1/threads/{conversation_id}/messages?since={after}"
# messages_path = "items"
# message_path = "payload"                                  # optionnel : message protocolaire dans chaque élément
# cursor_path = "next_cursor"                               # optionnel : absent => message_id du dernier message
# [transport.options.close]                                 # optionnel : absent => fermeture locale seulement
# method = "DELETE"
# url = "https://api.example.com/v1/threads/{conversation_id}"

# Options propres au codec (ADR-021) : aucune pour passthrough. Exemple complet pour une API de
# type chat-completions : le modèle répond par du texte (JSON du message entouré de prose ou de
# clôtures ```json), lu au chemin content_path de chaque élément rendu par le transport ; les
# messages sortants lui sont envoyés en texte (JSON canonique) dans le corps du POST.
#
# [transport]
# provider = "templated_http"
# codec = "json_text"
# [transport.codec_options]
# content_path = "choices[0].message.content"   # élément brut = objet ; absent => chaînes nues
# strip_code_fences = true                       # première clôture ```json ... ``` (ou ``` ... ```)
# extract_first_json_object = true               # premier objet/tableau JSON équilibré ; false = tout le texte
# id_path = "id"                                 # optionnel : message_id pris là s'il manque à l'enveloppe
# conversation_id_fallback = true                # false : conversation_id manquant refusé par le codec
# outbound = "text"                              # "object" (défaut) | "text" = canonical_json(message)
# [transport.options]
# headers = { "Authorization" = "Bearer ${env:MY_MODEL_KEY}" }
# [transport.options.init]
# url = "https://api.example.com/v1/threads"
# body = { instructions = "{instructions}", user = "{user_id}" }
# conversation_id_path = "id"
# [transport.options.post]
# url = "https://api.example.com/v1/threads/{conversation_id}/chat/completions"
# body = { messages = [{ role = "user", content = "{message_json}" }] }   # content reçoit le texte
# [transport.options.get]
# url = "https://api.example.com/v1/threads/{conversation_id}/completions?since={after}"
# messages_path = "data"                         # chaque élément est l'objet chat-completion brut
# cursor_path = "next_cursor"
#
# Codec tool_call (le modèle répond par un appel d'outil dont les arguments sont le message) :
# [transport.codec_options]
# arguments_path = "choices[0].message.tool_calls[0].function.arguments"   # défaut : "arguments"
# name_path = "choices[0].message.tool_calls[0].function.name"             # optionnel
# tool_name = "send_message"                     # optionnel : tout autre outil est refusé
# id_path = "choices[0].message.tool_calls[0].id"

# --------------------------------------------------------------------------------------------
# Profils de modèle nommés (ADR-024)
#
# Sans [models], la section [transport] ci-dessus EST le profil implicite nommé "default", et
# c'est lui qui est actif : rien à faire pour une configuration existante.
#
# Avec [models], chaque sous-table est un profil complet — toutes les clés de [transport] y sont
# valides, y compris [models.<nom>.options] et [models.<nom>.codec_options] — et models.active
# nomme celui avec lequel CE processus tourne. Un profil n'hérite de rien : il part des valeurs
# par défaut, pas de celles de [transport]. Le modèle est choisi une fois, au démarrage : changer
# de modèle = redémarrer avec un autre models.active (AGENTIC__MODELS__ACTIVE=claude au lancement),
# jamais en cours de session. Un active qui ne nomme aucun profil est une erreur de chargement
# (MODEL_PROFILE_UNKNOWN, avec la liste des noms disponibles).
#
# display_name et description ne servent qu'à l'affichage (catalogue de modèles du front) ;
# l'application ne les lit jamais. Le front sait aussi ce qu'un profil réclame et ce qui manque :
# credential_fields (voir [transport] ci-dessus) énumère les champs à afficher, et
# requires_credentials vaut vrai dès qu'un de ces champs n'a pas de valeur dans l'environnement.
#
# [models]
# active = "mock"                                  # profil actif de ce processus
#
# [models.mock]                                    # le serveur mock local, aucun jeton
# provider = "generic_http"
# codec = "passthrough"
# init_url = "http://127.0.0.1:9000/v1/conversations"
# display_name = "Mock local"
# description = "Serveur de test intégré (agentic-app mock-server)"
#
# [models.claude]                                  # une API de type chat-completions
# provider = "templated_http"
# codec = "json_text"
# token_env = "CLAUDE_API_KEY"                     # le jeton reste dans l'environnement
# display_name = "Claude (chat completions)"
# [[models.claude.credential_fields]]                # ce que l'interface demande pour ce profil
# key = "access_token"
# label = "Jeton d'accès"
# env = "CLAUDE_API_KEY"
# [models.claude.options]
# headers = { "Authorization" = "Bearer ${env:CLAUDE_API_KEY}" }
# [models.claude.options.init]
# url = "https://api.example.com/v1/threads"
# body = { instructions = "{instructions}", user = "{user_id}" }
# conversation_id_path = "id"

# --------------------------------------------------------------------------------------------
# Exécution des commandes (ADR-003, ADR-008, ADR-018)
# --------------------------------------------------------------------------------------------
[execution]
shell = ""                              # "" = défaut plateforme : bash/sh (POSIX), PowerShell (Windows)
cwd = "."                               # répertoire de travail des commandes
default_task_timeout_ms = 60000         # appliqué si la tâche ne déclare pas timeout_ms
max_task_timeout_ms = 900000            # plafond d'une valeur déclarée
cancel_drain_timeout_ms = 5000          # drain après une stop condition (SIGTERM -> SIGKILL)
interrupt_drain_timeout_ms = 5000       # drain après une interruption utilisateur (§2.9)
live_output_chunk_bytes = 4096          # taille max d'un événement task.output (flux live)
live_output_interval_ms = 250           # cadence max des événements task.output par tâche

# --------------------------------------------------------------------------------------------
# Espace de travail par session et fichiers temporaires (ADR-026)
#
# L'application n'écrit elle-même aucun fichier, mais les commandes du modèle en écrivent. Chaque
# session reçoit un dossier où elles peuvent le faire, annoncé aux commandes par les variables
# AGENTIC_SCRATCH_DIR et AGENTIC_WORKING_SPACE (même dossier, deux noms) et AGENTIC_SESSION_ID.
# Le répertoire de travail des commandes reste [execution] cwd : le dossier est offert, pas imposé.
# Un working_space fourni par l'utilisateur (champ « Working folder » du front) remplace le dossier
# généré ; il lui appartient, donc il n'est jamais ni supprimé ni archivé, quelle que soit policy.
# --------------------------------------------------------------------------------------------
[scratch]
enabled = true                          # false : aucun dossier créé, aucune variable exportée
root = "./data/scratch"                 # parent des dossiers par session (<root>/<session_id>),
                                        # créé à la première utilisation, en 0700 sur POSIX
policy = "delete"                       # fin de session, pour un dossier généré par l'application :
                                        # delete (supprimer l'arborescence), keep (la laisser),
                                        # archive (la déplacer sous archive_root)
archive_root = "./data/scratch-archive"  # destination de policy = "archive" :
                                        # <archive_root>/<session_id>-<horodatage>
                                        # doit rester en dehors de root
keep_on_failure = true                  # une session en échec garde son dossier quoi que dise
                                        # policy : c'est justement là qu'on veut regarder dedans
max_inventory_entries = 200             # borne de l'inventaire rendu (« qu'as-tu laissé ? ») ;
                                        # au-delà, l'inventaire est marqué tronqué

# --------------------------------------------------------------------------------------------
# Skills : les notes réutilisables proposées à la connexion (ADR-027)
#
# Une skill est un simple fichier Markdown écrit par l'utilisateur. L'application se contente de
# les LISTER (GET /skills), pour qu'une interface propose un choix plutôt qu'une saisie libre :
# rien n'est ouvert, rien n'est lu, rien n'est transmis au modèle. Les skills et le niveau d'effort
# envoyés à la création d'une session sont journalisés dans l'événement session.created et s'y
# arrêtent : ce qu'un modèle devrait en faire reste à décider (ADR-027, point ouvert).
# La liste est bornée (200 entrées, 3 niveaux de profondeur) et ne rend jamais d'erreur : une
# racine absente, vide ou illisible rend une liste vide.
# --------------------------------------------------------------------------------------------
[skills]
enabled = true                          # false : GET /skills rend une liste vide sans rien parcourir
root = ""                               # dossier parcouru à la recherche de *.md ; "" = aucun
                                        # (exemple : "~/agentic-skills")

# --------------------------------------------------------------------------------------------
# Limites de payload (ADR-010, ADR-005)
# --------------------------------------------------------------------------------------------
[payload]
default_max_output_bytes = 8192         # si ni la tâche ni le plan ne déclarent max_output_bytes
hard_max_output_bytes = 131072          # plafond absolu par tâche (<= max_message_bytes)
max_message_bytes = 196608              # taille max d'un message sortant (<= budget_bytes / 2, ADR-019)
max_state_summary_bytes = 4096          # taille max du state_summary porté par le modèle

# --------------------------------------------------------------------------------------------
# Protocole côté modèle (ADR-022, ADR-023)
# --------------------------------------------------------------------------------------------
[protocol]
allow_direct_response = true            # le modèle peut répondre au premier user_request d'une
                                        # conversation par un user_response (analyse, explication,
                                        # question à l'utilisateur) au lieu du discovery_plan
                                        # obligatoire de la spec §14 ; false = grammaire stricte.
                                        # Après un execution_result ou un user_request de suivi,
                                        # user_response est toujours accepté.
max_correction_attempts = 5             # ADR-023 : sur une réponse inutilisable (schéma, séquence,
                                        # sémantique, ou illisible par le codec), l'application
                                        # envoie un protocol_correction_request — rappel du
                                        # protocole, détails de la faute, types attendus, exemple
                                        # minimal valide — et relit, au plus ce nombre de réponses
                                        # inutilisables d'affilée. Une correction ne consomme ni
                                        # cycle ni plan ; le budget de durée, lui, continue de
                                        # courir. Au-delà : politique d'avant ADR-023 (rotation si
                                        # la fenêtre n'est pas HEALTHY et que
                                        # rotate_on_unusable_reply_in_warning est vrai, sinon échec
                                        # de session). 0 désactive la politique : la première
                                        # réponse inutilisable termine la session.

# --------------------------------------------------------------------------------------------
# Fenêtre de contexte et rotation (ADR-013, ADR-005)
# --------------------------------------------------------------------------------------------
[context]
budget_bytes = 400000                   # octets cumulés échangés par conversation
warning_ratio = 0.70                    # HEALTHY -> WARNING
saturation_ratio = 0.90                 # WARNING -> SATURATED
rotate_on_unusable_reply_in_warning = true  # en WARNING, réponse inutilisable => rotation (ADR-019)
max_rotations_per_session = 5           # au-delà : ROTATION_FAILED
summary_budget_bytes = 32768            # budget dur du résumé de contexte

# --------------------------------------------------------------------------------------------
# Budget de session par défaut (§2.8, ADR-012) — la user_request peut le surcharger
# --------------------------------------------------------------------------------------------
[budget]
default_max_cycles = 20
default_max_plans = 10
default_max_total_duration_ms = 300000
auto_close_on_final_answer = false      # §2.7

# --------------------------------------------------------------------------------------------
# Retries de transport (§7.3) et disjoncteur (§7.4)
# --------------------------------------------------------------------------------------------
[retry]
max_attempts = 4
base_delay_ms = 500
max_delay_ms = 8000
jitter_ratio = 0.0                      # 0 = backoff strictement déterministe

[circuit_breaker]
failure_threshold = 5                   # échecs consécutifs avant ouverture
open_duration_ms = 30000                # durée d'ouverture avant HALF_OPEN
half_open_max_calls = 1

# --------------------------------------------------------------------------------------------
# API HTTP locale pour la CLI et le front de bureau (ADR-018, ADR-028)
# --------------------------------------------------------------------------------------------
[api]
host = "127.0.0.1"
port = 8765
cors_origins = [                        # origines autorisées : le front de bureau Tauri et son
    "http://localhost:1420",            # serveur de développement Vite, dont le port est épinglé
    "http://127.0.0.1:1420",            # à 1420 (vite.config.ts, strictPort) ; les deux
    "http://localhost:3000",            # orthographes de la boucle locale ne sont pas la même
    "http://localhost:5173",            # origine pour un navigateur, il faut donc les deux à
    "http://127.0.0.1:5173",            # chaque fois (5173 = port Vite par défaut, 3000 =
    "tauri://localhost",                # port historique du front)
]
page_size = 100
sse_queue_size = 1000                   # événements en attente par client SSE avant abandon du client
allow_destructive_admin = false         # ATTENTION : true ouvre POST /admin/reset-database, qui
                                        # VIDE la base (sessions, conversations, plans, tâches,
                                        # messages, blobs, échecs ET chaîne d'audit) sans
                                        # confirmation ni sauvegarde, et sans rien demander à
                                        # personne. Irréversible. À ne mettre à true que sur une
                                        # installation de démonstration ou de test ; à false, la
                                        # route répond 403 ADMIN_DISABLED et ne touche à rien.

[cli]
refresh_interval_ms = 250

[telemetry]
enabled = true
