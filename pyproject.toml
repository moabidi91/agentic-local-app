[project]
name = "agentic-local-app"
version = "0.1.0"
description = "Local application orchestrating a single remote model through a strict, deterministic, auditable POST/GET message protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "HaMa" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agentic-app = "agentic_local_app.interfaces.cli:main"

# Transport providers (ADR-020). The built-in ones are registered by name when the transport
# package is imported; they are also published here to show how a third-party distribution
# exposes a provider (registered names take precedence, so nothing is listed twice).
[project.entry-points."agentic_local_app.transports"]
generic_http = "agentic_local_app.transport.providers.generic_http:GenericHttpProvider"
templated_http = "agentic_local_app.transport.providers.templated_http:TemplatedHttpProvider"
fake = "agentic_local_app.transport.fake:FakeTransportProvider"

# Message codecs (ADR-021): the same mechanism for the codec selected by transport.codec.
[project.entry-points."agentic_local_app.codecs"]
passthrough = "agentic_local_app.transport.codecs.passthrough:PassthroughCodec"
json_text = "agentic_local_app.transport.codecs.json_text:JsonTextCodec"
tool_call = "agentic_local_app.transport.codecs.tool_call:ToolCallCodec"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_local_app"]

# ---------------------------------------------------------------------------
# pytest — the spec (§18.4) mandates test names of the form
#   given_<initial_state>_when_<action>_then_<expected_outcome>
# so test functions are collected with the `given_` prefix (plus the usual
# `test_` prefix for helpers/smoke tests).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# examples/ holds the out-of-tree plugin quoted by the guides (acme_model_plugin); its tests import it
pythonpath = ["examples"]
python_files = ["test_*.py"]
python_functions = ["given_*", "test_*"]
python_classes = ["Test*", "Given*"]
asyncio_mode = "auto"
timeout = 30
addopts = "-ra --strict-markers"
markers = [
    "phase0: foundation (domain, config, bus, in-memory store)",
    "phase1: state machines",
    "phase2: protocol layer",
    "phase3: persistence layer",
    "phase4: task execution",
    "phase5: plan execution",
    "phase6: interruption",
    "phase7: transport and failure handling",
    "phase8: context rotation",
    "phase9: protocol orchestration (integration)",
    "phase10: audit and observability",
    "real_subprocess: spawns a real shell process (skipped on CI platforms that cannot run it)",
    "conformance: protocol conformance battery (what the application does with a misbehaving model)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
# N802: test names use the mandated given_when_then convention and may be long.
ignore = ["N802", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# the example plugin of the guides is type-checked like the application itself
packages = ["agentic_local_app", "acme_model_plugin"]
mypy_path = "src:examples"
